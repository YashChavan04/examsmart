spring.application.name=exam-platform-backend

# --- Database (MySQL) ---
spring.datasource.url=jdbc:mysql://localhost:3306/examsmart?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=yash@123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA should not manage schema - Flyway owns it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Hibernate 6 defaults java.util.UUID columns to BINARY(16) on MySQL, but
# the Flyway migrations (V1__init.sql) use CHAR(36) throughout - both for
# @Id fields (already pinned with @JdbcTypeCode(SqlTypes.CHAR) on each
# entity) and, more importantly, every @ManyToOne foreign-key column,
# which does NOT automatically inherit that per-entity annotation. This
# one setting fixes it globally for every UUID column at once, rather than
# needing @JdbcTypeCode on every single @ManyToOne/@JoinColumn field.
spring.jpa.properties.hibernate.type.preferred_uuid_jdbc_type=CHAR

# --- Flyway ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# --- Server ---
server.port=8080
